<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delos</title>
  <link rel="stylesheet" href="../shared/theme.css" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background-color: var(--bg-panel);
      border-bottom: 1px solid var(--border-accent);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 28px;
      height: 28px;
      display: block;
      flex-shrink: 0;
    }

    .logo-text {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--text-main);
    }

    .settings-btn {
      background-color: var(--bg-control);
      border: 1px solid var(--border-main);
      cursor: pointer;
      color: var(--text-muted);
      width: 30px;
      height: 30px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .settings-btn:hover {
      background-color: var(--accent-bg);
      color: var(--accent-text);
      border-color: var(--accent-border);
    }

    .content {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
    }

    .status-badge.blocked {
      background-color: var(--status-err-bg);
      border: 1px solid var(--status-err-border);
      color: var(--status-err-text);
    }

    .status-badge.no-key {
      background-color: var(--status-warn-bg);
      border: 1px solid var(--status-warn-border);
      color: var(--status-warn-text);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .blocked .status-dot { background-color: var(--status-err-text); }
    .no-key  .status-dot { background-color: var(--status-warn-text); }

    .toggle-card {
      background-color: var(--bg-panel);
      border: 1px solid var(--border-main);
      border-radius: 6px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .toggle-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
    }

    .toggle-sublabel {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 26px;
      flex-shrink: 0;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      inset: 0;
      background-color: var(--bg-control);
      border: 1px solid var(--border-main);
      border-radius: 6px;
      cursor: pointer;
    }
    .slider::before {
      content: '';
      position: absolute;
      left: 3px;
      top: 3px;
      width: 18px;
      height: 18px;
      border-radius: 4px;
      background-color: var(--text-dim);
      transition: transform 0.15s;
    }
    input:checked + .slider {
      background-color: var(--accent-bg);
      border-color: var(--accent-border);
    }
    input:checked + .slider::before {
      transform: translateX(20px);
      background-color: var(--accent-text);
    }
    input:disabled + .slider {
      cursor: not-allowed;
      background-color: var(--bg-page);
    }

    .settings-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      border: 1px solid var(--border-main);
      background-color: var(--bg-panel);
      width: 100%;
      border-radius: 6px;
    }

    .settings-link-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .settings-link:hover {
      background-color: var(--accent-bg);
      color: var(--accent-text);
      border-color: var(--accent-border);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img class="brand-logo" src="/icons/icon-128.png" alt="Delos" />
      <span class="logo-text">DELOS</span>
    </div>
    <button class="settings-btn" id="settingsBtn" data-i18n-title="popupOpenSettings" title="Settings & subtitles">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>

  <div class="content">
    <div class="status-badge blocked" id="badgeBlocked" style="display:none">
      <span class="status-dot"></span>
      <span data-i18n="popupBlocked">Not available on this site</span>
    </div>

    <div class="status-badge no-key" id="badgeNoKey" style="display:none">
      <span class="status-dot"></span>
      <span data-i18n="popupNeedKey">Add API key in settings</span>
    </div>

    <div class="toggle-card">
      <div>
        <div class="toggle-label" data-i18n="popupSubtitles">Subtitles on tab</div>
        <div class="toggle-sublabel" id="toggleSublabel" data-i18n="popupOff">Off</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggleInput" />
        <span class="slider"></span>
      </label>
    </div>

    <button class="settings-link" id="settingsLink">
      <span class="settings-link-left">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="4" y1="21" x2="4" y2="14"/>
          <line x1="4" y1="10" x2="4" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="12"/>
          <line x1="12" y1="8" x2="12" y2="3"/>
          <line x1="20" y1="21" x2="20" y2="16"/>
          <line x1="20" y1="12" x2="20" y2="3"/>
          <line x1="1" y1="14" x2="7" y2="14"/>
          <line x1="9" y1="8" x2="15" y2="8"/>
          <line x1="17" y1="16" x2="23" y2="16"/>
        </svg>
        <span data-i18n="popupOpenSettings">Settings & subtitles</span>
      </span>
      <span>→</span>
    </button>
  </div>

  <script type="module" src="index.ts"></script>
</body>
</html>
