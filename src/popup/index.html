<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delos</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f12;
      color: #e8e8f0;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 12px;
      border-bottom: 1px solid #1e1e2a;
    }
    .logo {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #a78bfa;
    }
    .settings-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #6b6b80;
      padding: 4px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      transition: color 0.15s, background 0.15s;
    }
    .settings-btn:hover { color: #a78bfa; background: #1e1e2a; }

    /* ── Main content ── */
    .content {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ── Status badge ── */
    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
    }
    .status-badge.blocked  { background: #2a1a1a; color: #f87171; }
    .status-badge.no-key   { background: #1a1a2a; color: #fbbf24; }
    .status-badge.ready    { background: #0f1f18; color: #6ee7b7; display: none; }
    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .blocked  .status-dot { background: #f87171; }
    .no-key   .status-dot { background: #fbbf24; }
    .ready    .status-dot { background: #6ee7b7; }

    /* ── Toggle row ── */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 0;
    }
    .toggle-label {
      font-size: 14px;
      font-weight: 500;
      color: #c4c4d4;
    }
    .toggle-sublabel {
      font-size: 11px;
      color: #4e4e62;
      margin-top: 2px;
    }

    /* ── iOS-style toggle switch ── */
    .switch { position: relative; display: inline-block; width: 46px; height: 26px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0;
      background: #2a2a3a;
      border-radius: 26px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .slider::before {
      content: '';
      position: absolute;
      left: 3px; top: 3px;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: #6b6b80;
      transition: transform 0.2s, background 0.2s;
    }
    input:checked + .slider { background: #7c3aed; }
    input:checked + .slider::before { transform: translateX(20px); background: #fff; }
    input:disabled + .slider { opacity: 0.35; cursor: not-allowed; }

    /* ── Divider ── */
    .divider { height: 1px; background: #1e1e2a; }

    /* ── Settings link ── */
    .settings-link {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      font-size: 12px;
      color: #6b6b80;
      cursor: pointer;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      border-radius: 6px;
      transition: color 0.15s;
    }
    .settings-link:hover { color: #a78bfa; }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">DELOS</span>
    <button class="settings-btn" id="settingsBtn" title="Налаштування">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/>
        <path d="M12 2v2M12 20v2M2 12h2M20 12h2"/>
      </svg>
    </button>
  </div>

  <div class="content">
    <!-- Blocked badge (visible only on music sites) -->
    <div class="status-badge blocked" id="badgeBlocked" style="display:none">
      <span class="status-dot"></span>
      <span>Недоступно на цьому сайті</span>
    </div>

    <!-- No API key badge -->
    <div class="status-badge no-key" id="badgeNoKey" style="display:none">
      <span class="status-dot"></span>
      <span>Додай API ключ у налаштуваннях</span>
    </div>

    <!-- Toggle row -->
    <div class="toggle-row">
      <div>
        <div class="toggle-label">Субтитри</div>
        <div class="toggle-sublabel" id="toggleSublabel">Вимкнено</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggleInput" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="divider"></div>

    <!-- Settings shortcut -->
    <button class="settings-link" id="settingsLink">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      Мова та API ключ
    </button>
  </div>

  <script type="module" src="index.ts"></script>
</body>
</html>
